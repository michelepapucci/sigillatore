<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-nome="Tessera" data-singolare="una tessera" data-articolo="alla tessera" data-plurale="tessere" data-secondo="punteggiata">
  <title>Tessera</title>
  <!-- dado visto di punta: corpo nero; smusso e punti in rosso puro = secondo smalto (di solito nero), così la tessera è piena; le linee sono sottili perché il contorno di stampa (ow) le porta allo spessore del bordo -->
  <path fill="#000" d="M50 0L100 50L50 100L0 50Z"/>
  <g fill="none" stroke="#ff0000" stroke-width="0.8" stroke-linejoin="miter">
    <path d="M50 12L88 50L50 88L12 50Z"/>
    <path d="M50 2V12M98 50H88M50 98V88M2 50H12"/>
  </g>
  <g fill="#ff0000"><circle cx="46.2" cy="30.2" r="5.6"/><circle cx="58.0" cy="42.0" r="5.6"/><circle cx="69.8" cy="53.8" r="5.6"/><circle cx="30.2" cy="46.2" r="5.6"/><circle cx="42.0" cy="58.0" r="5.6"/><circle cx="53.8" cy="69.8" r="5.6"/></g>
